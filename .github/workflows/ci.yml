name: CI and Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            worker/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Ruff
        run: ruff check backend

      - name: Unit tests
        run: pytest backend -q

      - name: Bandit SAST
        run: bandit -r backend -x backend/test_app.py

      - name: Python dependency audit
        run: pip-audit -r backend/requirements.txt

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: k8s
          framework: kubernetes
          soft_fail: false

      - name: Build images
        run: |
          docker build -t cloudcart-backend:test backend
          docker build -t cloudcart-worker:test worker
          docker build -t cloudcart-frontend:test frontend

      - name: Trivy image scans
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: cloudcart-backend:test
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
