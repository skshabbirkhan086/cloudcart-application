apiVersion: v1
kind: Service
metadata:
  name: worker-metrics
  namespace: cloudcart-dev
  labels: {app: worker}
spec:
  selector: {app: worker}
  ports: [{name: metrics, port: 9101, targetPort: 9101}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: cloudcart-dev
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: WORKER_IMAGE
          ports: [{name: metrics, containerPort: 9101}]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: cloudcart-secrets, key: POSTGRES_PASSWORD}
            - {name: REDIS_URL, value: redis://redis:6379/0}
            - {name: DATABASE_URL, value: postgresql+psycopg://cloudcart:$(POSTGRES_PASSWORD)@postgres:5432/cloudcart}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
