apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cloudcart-dev
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: cloudcart-dev
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: cloudcart}
            - {name: POSTGRES_USER, value: cloudcart}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: cloudcart-secrets, key: POSTGRES_PASSWORD}
          readinessProbe:
            exec: {command: ["sh","-c","pg_isready -U cloudcart -d cloudcart"]}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 10Gi}
