<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CloudCart</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header><h1>CloudCart</h1><p>Order Management Platform</p></header>
<main>
<section>
  <h2>Products</h2>
  <div id="products" class="grid"></div>
</section>
<section>
  <h2>Place an order</h2>
  <form id="order-form">
    <input id="customer" placeholder="Customer name" required>
    <select id="product" required></select>
    <input id="quantity" type="number" value="1" min="1" max="100" required>
    <button>Submit order</button>
  </form>
  <p id="message"></p>
</section>
<section>
  <h2>Recent orders</h2>
  <button onclick="loadOrders()">Refresh</button>
  <table>
    <thead><tr><th>ID</th><th>Customer</th><th>Status</th><th>Total</th></tr></thead>
    <tbody id="orders"></tbody>
  </table>
</section>
</main>
<script src="/app.js"></script>
</body>
</html>
